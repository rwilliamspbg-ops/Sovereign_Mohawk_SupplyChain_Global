name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate contract fixtures
        run: |
          python3 scripts/validate_dashboard_contract.py
          python3 scripts/validate_policy_pack.py
          python3 scripts/validate_observability_mapping.py

      - name: Run unit test
        run: |
          python3 -m unittest -q tests/test_contract_validator.py tests/test_upgrade_validators.py

      - name: Start mock API and smoke endpoints
        run: |
          python3 mock_api/server.py > /tmp/supplychain-mock.log 2>&1 &
          MOCK_PID=$!
          trap "kill ${MOCK_PID}" EXIT
          for _ in $(seq 1 20); do
            if curl -fsS "http://localhost:8088/healthz" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS "http://localhost:8088/healthz" >/dev/null 2>&1; then
            echo "Mock API did not become ready in time"
            cat /tmp/supplychain-mock.log || true
            exit 1
          fi
          for endpoint in stats regions pipeline risk health; do
            curl -fsS "http://localhost:8088/api/supplychain/${endpoint}" >/dev/null
          done
